# Plinth L1 local stack. Run with: podman compose -f deploy/compose/compose.yaml up -d
# Infrastructure (postgres, objectstore) starts by default. App services sit behind the "app" profile:
#   podman compose -f deploy/compose/compose.yaml --profile app up -d --build
# Host mode (pnpm dev) uses only the infrastructure services. Host ports avoid native services:
# postgres 55432, objectstore 59000 (S3, SeaweedFS). No Redis and no Kafka in L1.
name: plinth

x-app-env: &app-env
  PLINTH_DB_HOST: postgres
  PLINTH_DB_PORT: "5432"
  PLINTH_DB_NAME: plinth
  PLINTH_DB_USER: plinth
  PLINTH_DB_PASSWORD: plinth
  PLINTH_S3_ENDPOINT: http://objectstore:8333
  PLINTH_S3_BUCKET: plinth-data
  PLINTH_S3_ACCESS_KEY: plinth
  PLINTH_S3_SECRET_KEY: plinth-secret
  PLINTH_DUCKDB_AUTOINSTALL: "true"

services:
  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: plinth
      POSTGRES_PASSWORD: plinth
      POSTGRES_DB: plinth
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plinth -d plinth"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object store. MinIO no longer publishes images, so the local stand-in is SeaweedFS.
  # The application only speaks the S3 API (path-style), so this is a drop-in BlobStore backend.
  objectstore:
    image: docker.io/chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweed/s3.json", "-volume.max=0", "-master.volumeSizeLimitMB=256"]
    ports:
      - "127.0.0.1:59000:8333"
    volumes:
      - objdata:/data
      - ./seaweed-s3.json:/etc/seaweed/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/status || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 60

  api:
    profiles: ["app"]
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile, target: plinth-app }
    command: ["api"]
    environment: *app-env
    ports: ["8782:8782"]
    depends_on:
      postgres: { condition: service_healthy }
      objectstore: { condition: service_healthy }

  rt:
    profiles: ["app"]
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile, target: plinth-app }
    command: ["rt"]
    environment: *app-env
    ports: ["8781:8781"]
    depends_on:
      api: { condition: service_started }

  mcp:
    profiles: ["app"]
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile, target: plinth-app }
    command: ["mcp"]
    environment: *app-env
    ports: ["8790:8790"]
    depends_on:
      api: { condition: service_started }

  web:
    profiles: ["app"]
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile, target: plinth-app }
    command: ["web"]
    environment:
      PLINTH_API_URL: http://api:8782
      PLINTH_RT_URL: ws://rt:8781
    ports: ["5173:5173"]
    depends_on:
      - api
      - rt

  # One-shot: reset the control store to the seed, then land the seeded history.
  seed:
    profiles: ["seed"]
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile, target: plinth-gen }
    command: ["seed"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      objectstore: { condition: service_healthy }

volumes:
  pgdata: {}
  objdata: {}
