<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Plinth Suite</title>
    <!-- Variable fonts (Google Fonts, display=swap): Fraunces for folio, Inter Tight for lattice, IBM Plex Sans for
         nocturne. A face downloads only when a look that names it is active; calm and meridian use system stacks. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&amp;family=IBM+Plex+Sans:wght@300..700&amp;family=Inter+Tight:wght@300..800&amp;display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- Same-origin document links are prefetched on hover (the app is a History-API router, so this only helps a
         hard navigation, a new tab or a reload). Identity switches (?as=) and the API are never speculated. -->
    <script type="speculationrules">
      {
        "prefetch": [
          {
            "where": {
              "and": [
                { "href_matches": "/*" },
                { "not": { "href_matches": "/api/*" } },
                { "not": { "href_matches": { "search": "*as=*" } } },
                { "not": { "selector_matches": "[rel~=nofollow], [download]" } }
              ]
            },
            "eagerness": "moderate"
          }
        ]
      }
    </script>
    <script>
      // Static hosting (GitHub Pages): 404.html saved the deep link it was asked for and sent the browser here; put
      // that path back before any module reads location (identity reads ?as= at import).
      try {
        var r = sessionStorage.getItem("plinth-spa-redirect");
        if (r) {
          sessionStorage.removeItem("plinth-spa-redirect");
          var u = new URL(r, location.href);
          if (u.origin === location.origin) history.replaceState(null, "", u.pathname + u.search + u.hash);
        }
      } catch (e) {}
    </script>
    <script>
      // Apply the saved theme before first paint so the page does not flash.
      try {
        var t = localStorage.getItem("plinth-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <script type="module" src="/src/app/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app" data-shell>
      <nav class="app__nav" id="app-nav" aria-label="Primary"></nav>
      <header class="app__topbar" id="app-topbar"></header>
      <main class="app__main" id="main" tabindex="-1"></main>
    </div>
    <div class="app__drawers" id="app-drawers"></div>
    <section class="toasts" id="toasts" aria-label="Notifications"></section>
    <dialog class="palette" id="palette" aria-label="Command palette"></dialog>
    <p class="sr-only" id="announcer" role="status" aria-live="polite"></p>
  </body>
</html>
