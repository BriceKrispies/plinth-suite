<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Plinth</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the dashboard</a>

  <header class="masthead">
    <div class="masthead__brand">
      <a class="wordmark" href="./" aria-label="Plinth, all dashboards">
        <svg class="wordmark__mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <rect x="3" y="3" width="18" height="11" rx="1" fill="currentColor" opacity=".18"/>
          <rect x="3" y="14" width="18" height="3" fill="currentColor"/>
          <rect x="1" y="19" width="22" height="2" fill="currentColor"/>
        </svg>
        <span class="wordmark__text">Plinth</span>
      </a>
      <nav class="masthead__section" id="crumb" aria-label="Breadcrumb"></nav>
    </div>

    <div class="masthead__tools">
      <p class="conn" id="conn" role="status" data-state="connecting">
        <span class="conn__dot" aria-hidden="true"></span>
        <span class="conn__text">Connecting</span>
      </p>
      <div class="identity" role="group" aria-label="Identity">
        <span class="avatar" id="identity-avatar" aria-hidden="true"></span>
        <label class="identity__label" for="identity-select">Viewing as</label>
        <select class="identity__select" id="identity-select"></select>
      </div>
      <ul class="presence" id="presence" role="list" aria-label="People viewing this page"></ul>
    </div>
  </header>

  <main id="main" class="page" tabindex="-1" aria-label="Dashboard"></main>

  <aside class="trace" id="trace" aria-labelledby="trace-title" data-empty>
    <div class="trace__head">
      <h2 class="trace__title" id="trace-title">Change ledger</h2>
      <p class="trace__head-meta" id="trace-meta">Awaiting changes</p>
      <button class="trace__more" type="button" id="trace-more" aria-expanded="false" aria-controls="trace-list">Show all</button>
    </div>
    <ol class="trace__list" id="trace-list" role="list" aria-live="polite" aria-relevant="additions" aria-label="Recent changes, newest first"></ol>
    <p class="trace__empty">Changes appear here the moment they are committed.</p>
  </aside>

  <footer class="colophon">
    <p>Plinth operations platform</p>
    <p id="audit" data-state="pending">Change log: checking hash chain</p>
  </footer>

  <dialog class="inspector" id="inspector" aria-labelledby="inspector-title"></dialog>
  <p class="visually-hidden" id="announcer" role="status" aria-live="polite"></p>
</body>
</html>
