<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Plinth Meridian</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Apply a saved theme before first paint so the page does not flash.
      try {
        var t = localStorage.getItem("meridian-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body data-view="board">
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="shell">
      <header class="masthead">
        <div class="masthead__brand">
          <a class="brand" href="./" id="brand-link">Plinth</a>
          <span class="brand__sub">Operations platform</span>
        </div>

        <nav class="crumbs" aria-label="Breadcrumb">
          <ol>
            <li><a href="./" id="crumb-index">Boards</a></li>
            <li id="crumb-current" aria-current="page" hidden></li>
          </ol>
        </nav>

        <div class="masthead__tools">
          <p class="status" id="live-status" data-state="connecting">
            <span class="status__mark" aria-hidden="true"></span>
            <span class="status__text">Connecting</span>
          </p>

          <div class="identity">
            <label for="identity-select">Viewing as</label>
            <select id="identity-select"></select>
          </div>

          <div class="presence" role="group" aria-label="Presence: people on this board">
            <span class="avatar" id="presence-self" aria-hidden="true"></span>
            <span class="sr-only" id="presence-name"></span>
          </div>

          <button type="button" class="theme-toggle" id="theme-toggle">Auto</button>
        </div>
      </header>

      <div class="banner" id="banner" role="status" hidden>
        <p class="banner__text"></p>
      </div>

      <main class="page" id="main" tabindex="-1">
        <p class="sr-only">Loading</p>
      </main>

      <footer class="ribbon" id="ribbon" aria-label="Trace ribbon">
        <div class="ribbon__label">
          <h2 class="ribbon__title">Trace</h2>
          <p class="ribbon__head">Head <span class="ribbon__head-seq">#&ndash;</span></p>
          <button type="button" class="ribbon__toggle" aria-expanded="false" aria-controls="trace-list">Show recent</button>
        </div>
        <ol class="ribbon__list" id="trace-list" aria-live="polite" aria-relevant="additions" aria-label="Recent changes, newest first"></ol>
        <p class="ribbon__empty">Waiting for changes. Each change an agent or person makes appears here with its sequence number.</p>
      </footer>
    </div>

    <p class="sr-only" id="announcer" role="status" aria-live="polite"></p>

    <dialog class="inspector" id="inspector" aria-labelledby="inspector-title">
      <div class="inspector__content"></div>
    </dialog>
  </body>
</html>
