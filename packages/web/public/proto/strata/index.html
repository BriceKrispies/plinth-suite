<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Dashboards · Plinth</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="masthead" id="masthead">
    <div class="masthead__start">
      <a class="brand" href="index.html" data-link-index aria-label="Plinth, all dashboards">
        <svg class="brand__mark" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
          <rect class="brand__plate brand__plate--3" x="3" y="15" width="18" height="6" rx="2"/>
          <rect class="brand__plate brand__plate--2" x="5" y="9.5" width="14" height="6" rx="2"/>
          <rect class="brand__plate brand__plate--1" x="7" y="4" width="10" height="6" rx="2"/>
        </svg>
        <span class="brand__name">Plinth</span>
      </a>
      <nav class="crumbs" aria-label="Breadcrumb">
        <ol>
          <li><a href="index.html" data-link-index>Dashboards</a></li>
          <li data-crumb-current hidden><span aria-current="page"></span></li>
        </ol>
      </nav>
    </div>

    <div class="masthead__end">
      <p class="conn" data-conn data-state="connecting" role="status">
        <span class="conn__dot" aria-hidden="true"></span>
        <span class="conn__text" data-conn-text>Connecting</span>
      </p>
      <div class="identity">
        <label class="identity__label" for="identity">Acting as</label>
        <span class="avatar" aria-hidden="true" data-initials></span>
        <select class="identity__select" id="identity" data-identity></select>
      </div>
      <div class="presence" role="group" aria-label="Viewers on this board">
        <span class="avatar avatar--me" data-me><span aria-hidden="true" data-initials></span><span class="sr-only"></span></span>
      </div>
    </div>
  </header>

  <div class="notices" id="notice" hidden></div>

  <main class="main" id="main" tabindex="-1">
    <p class="muted">Loading</p>
  </main>

  <footer class="trace" id="trace" aria-labelledby="trace-title" hidden>
    <div class="trace__head">
      <h2 class="trace__title" id="trace-title">Trace</h2>
      <p class="trace__audit" data-trace-audit data-state="unknown">Audit chain pending</p>
    </div>
    <div class="trace__scroller" tabindex="0" role="region" aria-label="Recent changes, newest first">
      <p class="trace__empty" data-trace-empty>Waiting for changes</p>
      <ol class="trace__list" data-trace-list aria-live="polite" aria-relevant="additions" aria-label="Change events"></ol>
    </div>
  </footer>

  <p class="sr-only" id="announcer" role="status" aria-live="polite"></p>
  <dialog class="inspector" id="inspector" aria-labelledby="inspector-title"></dialog>
</body>
</html>
