<!doctype html>
<html lang="en">
  <head>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='6' width='12' height='8' fill='%23b08a5a'/%3E%3Cpath d='M1 6 8 2l7 4z' fill='%23785a36'/%3E%3C/svg%3E"
    />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3efe6" />
    <meta name="color-scheme" content="light" />
    <title>Northwind town</title>
    <script>
      // Static hosting (GitHub Pages): 404.html saved the deep link it was asked for and sent the browser here; put
      // that path back before any module reads location (identity reads ?as= at import).
      try {
        var r = sessionStorage.getItem("plinth-spa-redirect");
        if (r) {
          sessionStorage.removeItem("plinth-spa-redirect");
          var u = new URL(r, location.href);
          if (u.origin === location.origin) history.replaceState(null, "", u.pathname + u.search + u.hash);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
